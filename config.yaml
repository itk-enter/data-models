# Configuration for the itk-enter/data-models tooling.
#
# The validator (phase 3), generators (phase 4) and docs site (phase 6) all
# read published URLs from here, so that a model moving from our own
# namespace to Smart Data Models (D2 in data-models-PLAN.md) is a single
# change.

# Our own IRI namespace for terms and model types that aren't already SDM
# common-schema terms (D2). Common terms (address, location, …) keep their
# smartdatamodels.org IRIs; only terms defined for the first time in this
# repo's subjects use this one.
namespace: https://itk-enter.github.io/data-models

urls:
    # Immutable, per-tag: what a broker's contextUrl and Source pin (D8).
    raw: https://raw.githubusercontent.com/itk-enter/data-models
    # Latest-by-default: what people and term/model IRIs resolve to (phase 6).
    pages: https://itk-enter.github.io/data-models
    repo: https://github.com/itk-enter/data-models

# Third-party files vendored under vendor-assets/, pinned so validation and
# the docs site build offline and reproducibly. `task vendor:update` (not
# implemented yet) refreshes vendor-assets/ at these pins and checksums them.
vendor:
    common_schema:
        source: https://raw.githubusercontent.com/smart-data-models/data-models/{ref}/common-schema.json
        ref: 80c8cfb07c56478058eb1b5d8e9d9908c844e300
    swagger_ui:
        version: 5.33.0
