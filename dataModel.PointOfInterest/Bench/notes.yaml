notesHeader: >-
    Describes a public bench for city services, accessibility and wayfinding apps (e.g. routes with places to rest) and maintenance. Attributes follow OpenStreetMap amenity=bench tagging, https://wiki.openstreetmap.org/wiki/Tag:amenity%3Dbench, and each property's schema description names its OSM key, "Source: ...".
    The attribute set was checked against an Overpass export of 2,265 benches in Aarhus (2026-09-30). Share of benches carrying each key, backrest 87%, material 48% (wood 990, concrete 44, metal 17, plastic 14, granite 9, stone 8, steel 1), armrest 31%, check_date or survey:date 5%, seats 4%, direction 4%, colour 1%, lying_down 20, two_sided 14, seats:separated 4, bin 2, lit 1, level 1, hostile_architecture 1 (slanted). OSM keys covered and inscription didn't appear in the export but are standard bench tags and are included.
notesMiddle: >-
    Smart Data Models has no bench model; its generic OSMAmenity lists bench as an amenityType but has no bench attributes. This entity type therefore extends https://smart-data-models.github.io/dataModel.PointOfInterest/PointOfInterest/schema.json, reusing its common definitions GSMA-Commons, Location-Commons and contactPoint (Contact-Commons, used for fault reporting), plus PhysicalObject-Commons for color (OSM colour) and image (e.g. a Panoramax photo URL, OSM panoramax). Unlike PointOfInterest, name is not required, since benches rarely have one (3 of 2,265 in the export).
    Boolean properties are tri-state, omitted means unknown and false means known to be absent. Publishers should omit rather than default to false.
    When importing from OSM, use source for the element URL (e.g. https://www.openstreetmap.org/node/888668859) and dataProvider for attribution; OSM data is licensed under ODbL. Benches mapped as ways are exported by Overpass as their centre point, which is what location holds.
notesFooter: >-
    OSM keys deliberately not mapped, amenity (implied by the entity type), note (free text for mappers; use description, or inscription for engravings), access (3 benches, all yes; benches in this model are public), not:* keys (mapper hints), panoramax (map to image as a URL), and tourism=artwork with artwork_type and artist_name (1 bench; an artwork bench is better also published as an artwork entity).
    Open points, (a) the OSM wiki page couldn't be fetched when this model was written, so the key list and value sets (material, hostile_architecture) should be re-checked against it, (b) OSM direction also allows cardinal values (N, NE, …), which publishers must convert to degrees, (c) material values beyond the listed ones are dropped rather than mapped, (d) a companion BenchObserved entity for condition and faults is not included.
