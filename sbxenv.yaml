schemaVersion: "1"

agent: claude

# The domain is shared team-wide and not secret, so it gets a plain default rather
# than being required per project. Override it (rarely needed — only if this
# project's Leantime instance really lives elsewhere) in your own
# local.sbxenv.yaml, the same way GIT_IDENTITY_NAME is overridden.
args:
  leantime_domain:
    default: "stg.leantime.itkdev.dk"
    description: "Leantime instance host, no scheme — e.g. leantime.example.dk"

kits:
  - source: "git+https://github.com/itk-dev/itk-sbx#dir=kits/base-tools"
  - source: "git+https://github.com/itk-dev/itk-sbx#dir=kits/github"
  - source: "git+https://github.com/itk-dev/itk-sbx#dir=kits/leantime"
    args:
      domain: ${{ env.args.leantime_domain }}

workspace:
  path: .
  clone: false

# The traefik the base-tools kit runs listens on sandbox port 80. Publishing it
# here replaces the manual `sbx ports <sandbox> --publish` step — ports are
# published when the sandbox is created, so there is nothing to re-run and
# nothing that drifts between boots.
#
# No `host:` here deliberately: a pinned host port is published at create time
# and held for the sandbox's whole lifetime, including while stopped, not just
# while running. A fixed `host: 8000` therefore blocks a second sandbox from
# this project from ever being created while the first one exists at all — and
# a pinned port that's already taken doesn't degrade to a warning, it fails
# sandbox creation and removes the new sandbox outright. Omitting `host` takes
# an ephemeral port instead, which can never collide across sandboxes, at the
# cost of having to look the port up per sandbox with `sbx ports <sandbox>`.
#
# Reaching the site from the host therefore means finding the assigned port
# first, then putting it in the URL:
#   sbx ports <sandbox>
#   http://itk-sbx.local.itkdev.dk:<port>/
# Traefik's Host() matcher ignores the port, so routing still resolves. Inside
# the sandbox it stays plain port 80 — see the base-tools kit instructions.
ports:
  - sandbox: 80

# Pre-authorises the token injection the github and leantime kits declare, so
# create does not stop on the interactive "no binding authorizes <service>" consent
# prompt. Domains must match each kit's `credentials[].apiKey.inject[].domain` —
# missing one here is not an error, just a lone 401/403 from that host.
bindings:
  github:
    apiKey:
      domains:
        - api.github.com
        - github.com
        - uploads.github.com
        - raw.githubusercontent.com
        - codeload.github.com
  leantime:
    apiKey:
      domains:
        - ${{ env.args.leantime_domain }}

# Plain (non-secret) so the project's .mcp.json can reference it — Claude Code
# expands ${LEANTIME_DOMAIN} in both the url and headers of an http MCP server.
env:
  LEANTIME_DOMAIN: ${{ env.args.leantime_domain }}

