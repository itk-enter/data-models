name: Deploy docs site

env:
    COMPOSE_USER: runner

on:
    push:
        branches:
            - main
        tags:
            - "*/v*"
    workflow_dispatch:

concurrency:
    group: pages
    cancel-in-progress: false

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    # A release tag points at the commit main has just deployed, and
    # actions/deploy-pages uses that commit as the Pages build version.
    # Pages then keeps serving the earlier build of that commit when the
    # deploy comes from a tag push, although the run reports success. A
    # manual run of the same commit does replace it, so a tag push starts
    # one on main instead of deploying itself.
    # https://github.com/actions/deploy-pages/issues/383
    redispatch:
        name: Redeploy from main
        if: github.ref_type == 'tag'
        runs-on: ubuntu-latest
        permissions:
            actions: write
        steps:
            - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
              env:
                  GH_TOKEN: ${{ github.token }}

    build:
        name: Build the docs site
        if: github.ref_type != 'tag'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  # site:prepare lists each model's <Model>/v* tags.
                  fetch-depth: 0

            - uses: go-task/setup-task@v2

            - name: Create docker network
              run: docker network create frontend

            - name: Build the docs site
              run: task site:build

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: build/site

    deploy:
        name: Deploy to GitHub Pages
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
